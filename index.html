<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jaya Dhanusha S – Portfolio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E💻%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b1226;--surface:#141d38;--ink:#eaf0ff;--muted:#a3b1d1;--line:#26345a;--blue:#7b9bff;--blue-soft:#1d2b57;--teal:#3fd4bb;--teal-soft:#10353a;--amber:#ffc656;--amber-soft:#3a2d10;--navbg:rgba(11,18,38,.92);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(86px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.65 "Source Serif 4",Georgia,serif}
h1,h2,h3,nav,.btn,.label{font-family:"Plus Jakarta Sans",system-ui,sans-serif}
a{color:var(--blue)}
a:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navbg);z-index:20}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--navbg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:0 auto;padding:12px 22px;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:19px;color:var(--ink);text-decoration:none}
.menu{display:flex;flex-wrap:wrap;gap:4px}
.menu a{font-weight:700;font-size:15px;color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:8px}
.menu a:hover,.menu a.on{background:var(--blue-soft);color:var(--blue)}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
#home{text-align:center;padding:88px 0 76px;background:linear-gradient(180deg,var(--blue-soft),transparent 85%)}
h1{font-size:clamp(34px,7vw,62px);font-weight:800;letter-spacing:-.025em;line-height:1.08;margin:0 0 16px}
.role{font:700 clamp(19px,3.2vw,26px)/1.3 "Plus Jakarta Sans",sans-serif;color:var(--blue);margin:0}
.tag{font:800 clamp(22px,4vw,32px)/1.25 "Plus Jakarta Sans",sans-serif;color:var(--ink);margin:18px 0 14px}
.lead{max-width:46ch;margin:0 auto 12px;color:var(--muted);font-size:20px}
.lead.last{margin-bottom:30px}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-block;font-weight:700;font-size:16px;padding:13px 24px;border-radius:10px;border:2px solid var(--blue);text-decoration:none;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.btn.pri{background:var(--blue);color:#0b1226}
.btn.pri:hover{background:var(--amber);border-color:var(--amber);color:#1b1500}
.btn.sec{background:transparent;color:var(--blue)}
.btn.sec:hover{background:var(--teal);border-color:var(--teal);color:#04241f}
.social{display:flex;gap:10px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.social a{font:700 15px "Plus Jakarta Sans",sans-serif;text-decoration:none;color:var(--ink);padding:6px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.social a:hover{background:var(--amber-soft);border-color:var(--amber)}
section{padding:64px 0}
h2{font-size:32px;font-weight:800;margin:0 0 8px;letter-spacing:-.015em}
h2::after{content:"";display:block;width:56px;height:5px;border-radius:3px;background:var(--amber);margin-top:10px}
.intro{color:var(--muted);max-width:60ch;margin:14px 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.card h3{font-size:20px;margin:0 0 6px}
.card.b{border-top:5px solid var(--blue)}.card.t{border-top:5px solid var(--teal)}.card.a{border-top:5px solid var(--amber)}
.meta{color:var(--muted);font-size:16px;margin:0 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tags span{font:600 14px "Plus Jakarta Sans",sans-serif;background:var(--teal-soft);color:var(--ink);padding:3px 11px;border-radius:6px}
ul{padding-left:20px;margin:8px 0 0}li{margin:6px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row span:last-child{color:var(--muted);white-space:nowrap}
mark{background:var(--amber-soft);color:var(--ink);padding:0 4px;border-radius:4px}
dl{display:grid;grid-template-columns:max-content 1fr;gap:10px 18px;margin:0}
dt{font:700 16px "Plus Jakarta Sans",sans-serif}dd{margin:0;color:var(--muted)}
.chips a{display:inline-block;margin:0 8px 8px 0;font:700 15px "Plus Jakarta Sans",sans-serif;text-decoration:none;padding:7px 14px;border-radius:8px;background:var(--blue-soft);color:var(--blue)}
.chips a:hover{background:var(--blue);color:#fff}
.contact a.big{display:block;font:700 20px "Plus Jakarta Sans",sans-serif;margin:6px 0;overflow-wrap:anywhere}
footer{padding:28px 0 48px;color:var(--muted);font-size:15px;border-top:1px solid var(--line);text-align:center}
@media (max-width:640px){dl{grid-template-columns:1fr;gap:2px}dd{margin-bottom:10px}#home{padding:60px 0 56px}}
